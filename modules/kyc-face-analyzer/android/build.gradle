plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.bensonyu.kycdemo.faceanalyzer'
version = '0.1.0'

android {
  namespace "com.bensonyu.kycdemo.faceanalyzer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.mlkit:face-detection:16.1.7'
}
